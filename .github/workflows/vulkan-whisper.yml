name: Vulkan Whisper

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-python/**'
      - 'native/whisper_cpp_worker/**'
      - 'bat/**'
      - 'spec/**'
      - '.github/workflows/vulkan-whisper.yml'
  push:
    branches: [develop]
    paths:
      - 'src-python/**'
      - 'native/whisper_cpp_worker/**'
      - 'bat/**'
      - 'spec/**'
      - '.github/workflows/vulkan-whisper.yml'

jobs:
  windows-vulkan-pyinstaller:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Vulkan SDK
        shell: pwsh
        run: choco install vulkan-sdk --no-progress -y
      - name: Build persistent Vulkan worker
        shell: cmd
        run: bat\build_whisper_worker.bat
      - name: Install Python dependencies
        shell: cmd
        run: bat\install.bat
      - name: Run transcription tests
        shell: cmd
        run: .venv\Scripts\python.exe -m unittest discover -s src-python -p "test_transcription*.py" -v
      - name: Build CPU sidecar with bundled Vulkan worker
        shell: cmd
        run: bat\build.bat
      - name: Verify packaged worker
        shell: pwsh
        run: |
          $worker = Get-ChildItem -Recurse src-tauri/bin -Filter vrct-whisper-worker.exe
          if (-not $worker) { throw 'PyInstaller output does not contain vrct-whisper-worker.exe' }
          $worker | ForEach-Object { Write-Host $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: vrct-windows-sidecar-vulkan
          path: src-tauri/bin/
          if-no-files-found: error
