name: Windows Vulkan Release Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-python/**'
      - 'native/whisper_cpp_worker/**'
      - 'bat/**'
      - 'spec/**'
      - '.github/workflows/vulkan-whisper.yml'
  push:
    branches: [develop]
    paths:
      - 'src-python/**'
      - 'native/whisper_cpp_worker/**'
      - 'bat/**'
      - 'spec/**'
      - '.github/workflows/vulkan-whisper.yml'

jobs:
  windows-vulkan-release:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = [Environment]::GetEnvironmentVariable('VULKAN_SDK', 'Machine')
          if (-not $sdk) { throw 'Vulkan SDK installation did not set VULKAN_SDK' }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build persistent Vulkan worker
        shell: cmd
        run: bat\build_whisper_worker.bat
      - name: Probe native worker and inspect dependencies
        shell: pwsh
        run: |
          & native\whisper_cpp_worker\stage\whisper_cpp\vrct-whisper-worker.exe --probe
          if ($LASTEXITCODE -ne 0) { throw 'Native worker probe failed' }
          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -Recurse -Filter dumpbin.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if ($dumpbin) {
            & $dumpbin /DEPENDENTS native\whisper_cpp_worker\stage\whisper_cpp\vrct-whisper-worker.exe
          } else {
            Write-Warning 'dumpbin was unavailable; native startup probe still passed'
          }
      - name: Install Python dependencies
        shell: cmd
        run: bat\install.bat
      - name: Run backend, lifecycle, and model tests
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m unittest discover -s src-python -p "test_transcription*.py" -v
          .venv\Scripts\python.exe -m unittest discover -s src-python -p "test_model*.py" -v
      - name: Build final CPU/Vulkan application package
        run: npm run release
      - name: Smoke test frozen application and final release layout
        shell: pwsh
        run: |
          $release = 'src-tauri\target\release'
          $required = @(
            "$release\VRCT.exe",
            "$release\VRCT-sidecar.exe",
            "$release\_internal\whisper_cpp\vrct-whisper-worker.exe",
            'VRCT.zip'
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Missing final package resource: $item" }
          }
          & "$release\VRCT-sidecar.exe" --package-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Frozen sidecar package smoke test failed' }
          $zipNames = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'VRCT.zip')).Entries.FullName
          foreach ($name in @('VRCT.exe', 'VRCT-sidecar.exe', '_internal/whisper_cpp/vrct-whisper-worker.exe')) {
            if ($name -notin $zipNames) { throw "VRCT.zip is missing $name" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: vrct-windows-x64-vulkan-release
          path: |
            VRCT.zip
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
